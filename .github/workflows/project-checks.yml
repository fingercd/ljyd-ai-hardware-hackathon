name: Project checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check public-tree hygiene and local links
        run: python scripts/check_public_tree.py
      - name: Check committed whitespace
        run: git show --format= --check HEAD
