<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摄像头工作台</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#eaf0f8;background:#101827}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;margin:0}p{line-height:1.7;color:#b4c3d6}.tag{font-size:13px;color:#8bedd4;background:#143a39;border:1px solid #28615a;padding:8px 12px;border-radius:99px}.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;margin-top:25px}.view,.panel{background:#1a2638;border:1px solid #30405a;border-radius:18px}.view{min-height:520px;display:grid;place-items:center;position:relative;overflow:hidden}.view canvas{max-width:100%;max-height:510px;image-rendering:auto}.empty{position:absolute;color:#91a4bb;text-align:center;padding:20px;pointer-events:none}.panel{padding:24px}h2{font-size:19px;margin:0 0 12px}.status{background:#101a2a;border-radius:10px;padding:12px;color:#d8e5f4;min-height:52px;line-height:1.5;font-size:14px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:12px;font-size:15px;font-weight:650;cursor:pointer;background:#76e0c4;color:#102d2b}button.secondary{background:#34445b;color:white}button.record{background:#f17979;color:#301111}button:disabled{opacity:.45;cursor:not-allowed}.note{font-size:13px}footer{font-size:13px;color:#91a4bb;margin-top:20px}@media(max-width:720px){.layout{grid-template-columns:1fr}.view{min-height:380px}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header><div><h1>摄像头工作台</h1><p>BF3901 开发板 · 本机拍摄</p></div><span class="tag">仅本机访问</span></header><div class="layout"><section class="view"><canvas id="screen" width="240" height="320"></canvas><div id="empty" class="empty">还没有图像<br>点击“拍照”开始采集</div></section><aside class="panel"><h2>拍摄控制</h2><div id="device" class="status" role="status">正在检查设备连接…</div><button id="check" class="secondary">检查连接</button><div id="status" class="status" role="status">等待操作</div><button id="photo">拍照并下载 PNG</button><button id="record" class="secondary">开始低帧率录像</button><button id="stop" class="record" disabled>停止并下载录像</button><p class="note">现有固件每次只能传一帧，每帧都要普通复位开发板；采集可能需要几十秒。画面只在新帧到达时更新，不是实时预览。</p><p class="note">录像无声音，实际画面更新很慢，中间会保持上一帧；停止时等待正在采集的一帧结束。文件保存在浏览器的下载目录。</p></aside></div><footer>关闭页面或终端会停止使用；不要与其他串口程序同时使用。请勿分享启动地址。</footer></main>
<script>
const suppliedToken=location.hash.slice(1); if(suppliedToken)sessionStorage.setItem('cameraToken',suppliedToken); const token=suppliedToken||sessionStorage.getItem('cameraToken')||''; history.replaceState(null,'',location.pathname);
const canvas=document.querySelector('#screen'), ctx=canvas.getContext('2d'), status=document.querySelector('#status'), empty=document.querySelector('#empty');
const photo=document.querySelector('#photo'), record=document.querySelector('#record'), stop=document.querySelector('#stop'), check=document.querySelector('#check'), device=document.querySelector('#device');
let busy=false, recording=false, recorder=null, chunks=[], frames=0, finalizing=false, ready=false, checking=false;
function say(s){status.textContent=s} function buttons(){photo.disabled=!token||!ready||busy||recording||finalizing;record.disabled=!token||!ready||busy||recording||finalizing;stop.disabled=!recording;check.disabled=checking||busy||recording||finalizing;}
function download(blob,name){const a=document.createElement('a'), url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-')}
async function take(){busy=true;buttons();say('正在复位并接收真实帧，请等待，可能需要几十秒…');try{const response=await fetch('/capture',{method:'POST',headers:{'X-Camera-Token':token}});if(!response.ok)throw new Error(await response.text());const blob=await response.blob();const bitmap=await createImageBitmap(blob);if(canvas.width!==bitmap.width||canvas.height!==bitmap.height){canvas.width=bitmap.width;canvas.height=bitmap.height;}ctx.drawImage(bitmap,0,0);bitmap.close();empty.hidden=true;return blob}finally{busy=false;buttons()}}
photo.onclick=async()=>{try{const blob=await take();download(blob,`camera-${stamp()}.png`);say('拍照成功，已下载校验通过的真实图像。')}catch(e){say(e.message)}};
record.onclick=async()=>{if(!window.MediaRecorder||!canvas.captureStream){say('当前浏览器不支持录像，请使用新版 Chrome 或 Edge。');return}recording=true;frames=0;chunks=[];buttons();let stream=null;try{await take();if(!recording){say('已取消录像。');return}stream=canvas.captureStream(5);recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();frames=1;say('录像中：第 1 帧已采集，正在等待下一帧。');while(recording){await take();frames++;if(recording)say(`录像中：已采集 ${frames} 张真实帧。`)}await finishRecording();say(`录像结束：共 ${frames} 张真实帧，画面间隔不是实时视频。`)}catch(e){if(recorder&&recorder.state==='recording')await finishRecording(true);say(`录像中断：${e.message}；已有片段（如有）已下载。`)}finally{if(stream)stream.getTracks().forEach(t=>t.stop());recording=false;finalizing=false;recorder=null;buttons()}};
async function finishRecording(partial=false){const activeRecorder=recorder;await new Promise(resolve=>{activeRecorder.onstop=resolve;activeRecorder.stop()});if(chunks.length){const ext=activeRecorder.mimeType.includes('mp4')?'mp4':'webm';download(new Blob(chunks,{type:activeRecorder.mimeType}),`camera-${partial?'partial':'video'}-${stamp()}.${ext}`)}}
stop.onclick=()=>{recording=false;finalizing=true;buttons();say('正在停止：等待当前帧接收完成…')};
async function checkDevice(){checking=true;ready=false;device.textContent='正在检查设备连接…';buttons();try{const response=await fetch('/devices',{headers:{'X-Camera-Token':token}});if(!response.ok)throw new Error(await response.text());const result=await response.json();ready=result.ready;device.textContent=result.message}catch(e){device.textContent=`连接检查失败：${e.message}`}finally{checking=false;buttons()}}
check.onclick=checkDevice;buttons();if(token)checkDevice();else{check.disabled=true;device.textContent='无法检查设备';say('启动地址缺少访问凭证，请重新运行启动命令。')}
</script></body></html>
